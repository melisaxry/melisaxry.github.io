<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Melissa Land — Pink Fantasy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Quicksand loads without blocking render, so text shows instantly in a fallback font and then swaps in -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <!-- عکس بنر از همون اول با اولویت بالا دانلود می‌شه -->
    <link rel="preload" as="image" type="image/webp" imagesrcset="assets/hero-sm.webp 832w, assets/hero.webp 1408w" imagesizes="(max-width: 600px) calc(100vw - 36px), min(844px, calc(100vw - 36px))" fetchpriority="high" />
    <style>
      :root {
        color-scheme: light;
        --bg: #fff5f9;
        --bg-soft: #ffeef6;
        --surface: #ffffff;
        --surface-border: #ffd3e6;
        --ink: #5c1a38;
        --ink-soft: #9c4a72;
        --pink: #ff5c9e;
        --pink-deep: #e83e8c;
        --pink-dark: #c2255c;
        --rose: #ff8fb8;
        --blush: #ffd9e9;
        --gold: #ffb84d;
        --shadow: 0 18px 40px rgba(232, 62, 140, 0.16);
        --btn-shadow: 0 14px 34px rgba(232, 62, 140, 0.45), 0 4px 10px rgba(232, 62, 140, 0.3);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #22101b;
          --bg-soft: #2d1524;
          --surface: #351b2c;
          --surface-border: #5c2c47;
          --ink: #ffe3ef;
          --ink-soft: #f0a8c6;
          --pink: #ff6fae;
          --pink-deep: #ff4f9a;
          --pink-dark: #ff8fbe;
          --rose: #ff9ec4;
          --blush: #4a2438;
          --gold: #ffc46b;
          --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
          --btn-shadow: 0 14px 34px rgba(255, 79, 154, 0.35), 0 4px 10px rgba(0, 0, 0, 0.4);
        }
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Quicksand", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.8;
        overflow-x: hidden;
      }

      /* لایه‌ی ذرات شناور (قلب و ستاره) */
      #particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .particle {
        position: absolute;
        bottom: -40px;
        opacity: 0;
        animation: floatUp linear infinite;
      }
      .particle svg { display: block; }
      @keyframes floatUp {
        0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
        10%  { opacity: 0.75; }
        85%  { opacity: 0.6; }
        100% { transform: translateY(-110vh) rotate(50deg); opacity: 0; }
      }

      /* صفحه دقیقاً یک نما است؛ بدون اسکرول عمودی */
      html, body { height: 100%; }
      body { overflow: hidden; }

      .wrap {
        position: relative;
        z-index: 1;
        max-width: 880px;
        margin: 0 auto;
        padding: 16px 18px 20px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* ---------- هدر / هیرو ---------- */
      .hero {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        min-height: 0;
      }

      /* فقط تصویر کوچک می‌شود تا بقیه‌ی محتوا همیشه کامل دیده شود */
      .hero > *:not(.hero-art) { flex: none; }

      .hero-art {
        position: relative;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 3px solid var(--surface-border);
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }
      .hero-art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero-art::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(255, 245, 249, 0.35), transparent 45%);
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        .hero-art::after { background: linear-gradient(to top, rgba(34, 16, 27, 0.35), transparent 45%); }
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 18px;
        padding: 6px 16px;
        background: var(--bg-soft);
        border: 1.5px dashed var(--rose);
        border-radius: 999px;
        color: var(--pink-dark);
        font-size: 0.92rem;
        font-weight: 700;
      }
      .badge svg { flex: none; }

      h1 {
        margin: 14px 0 6px;
        font-size: clamp(2rem, 7.5vw, 3.4rem);
        font-weight: 900;
        line-height: 1.35;
        color: var(--ink);
      }
      h1 .accent { color: var(--pink-deep); }

      .hero-sub {
        margin: 0 auto;
        max-width: 560px;
        color: var(--ink-soft);
        font-size: clamp(1rem, 3.4vw, 1.15rem);
        font-weight: 500;
      }

      /* ---------- دکمه‌ی فانتزی تلگرام ---------- */
      .cta-zone { margin-top: 22px; }

      .tg-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        min-height: 64px;
        padding: 14px 22px 14px 30px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff7eb0 0%, var(--pink-deep) 55%, var(--pink-dark) 100%);
        color: #fff;
        text-decoration: none;
        font-family: inherit;
        font-size: clamp(1.1rem, 4vw, 1.3rem);
        font-weight: 800;
        box-shadow: var(--btn-shadow);
        overflow: visible;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .tg-btn:hover { transform: translateY(-3px) scale(1.02); }
      .tg-btn:active { transform: translateY(0) scale(0.98); }
      .tg-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

      /* برقِ روی دکمه */
      .tg-btn .shine {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
        pointer-events: none;
      }
      .tg-btn .shine::before {
        content: "";
        position: absolute;
        top: -60%;
        bottom: -60%;
        width: 36%;
        left: -50%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        transform: rotate(8deg);
        animation: shineSweep 3.2s ease-in-out infinite;
      }
      @keyframes shineSweep {
        0%, 55% { left: -50%; }
        85%, 100% { left: 130%; }
      }

      /* حلقه‌ی تپنده دور دکمه */
      .tg-btn::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        border: 2.5px solid var(--pink);
        opacity: 0;
        animation: pulseRing 2.4s ease-out infinite;
        pointer-events: none;
      }
      @keyframes pulseRing {
        0% { transform: scale(1); opacity: 0.55; }
        70%, 100% { transform: scale(1.09, 1.22); opacity: 0; }
      }

      .tg-logo {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: inset 0 -3px 6px rgba(232, 62, 140, 0.18), 0 3px 8px rgba(0, 0, 0, 0.15);
      }
      .tg-logo svg { margin-left: 2px; }

      .tg-btn .sparkle {
        position: absolute;
        pointer-events: none;
        animation: twinkle 1.8s ease-in-out infinite;
      }
      .tg-btn .sparkle.s1 { top: -13px; inset-inline-start: 26px; }
      .tg-btn .sparkle.s2 { bottom: -11px; inset-inline-end: 44px; animation-delay: 0.6s; }
      .tg-btn .sparkle.s3 { top: -9px; inset-inline-end: 18px; animation-delay: 1.1s; }
      @keyframes twinkle {
        0%, 100% { transform: scale(0.7) rotate(0deg); opacity: 0.5; }
        50% { transform: scale(1.15) rotate(25deg); opacity: 1; }
      }

      .cta-note {
        margin-top: 14px;
        color: var(--ink-soft);
        font-size: 0.95rem;
        font-weight: 500;
      }

      @media (prefers-reduced-motion: reduce) {
        .particle, .tg-btn .shine::before, .tg-btn::after, .tg-btn .sparkle { animation: none !important; }
        .tg-btn::after { display: none; }
        html { scroll-behavior: auto; }
      }
    </style>
  </head>
  <body>
    <div id="particles" aria-hidden="true"></div>

    <div class="wrap">
      <!-- هیرو -->
      <header class="hero">
        <div class="hero-art">
          <img src="assets/hero.webp" srcset="assets/hero-sm.webp 832w, assets/hero.webp 1408w" sizes="(max-width: 600px) calc(100vw - 36px), min(844px, calc(100vw - 36px))" alt="A dreamy pink castle with heart-shaped windows on pink clouds, and a red-haired girl in a pink dress blowing a kiss" width="1408" height="796" fetchpriority="high" decoding="async" />
        </div>

        <span class="badge">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#ff5c9e" aria-hidden="true"><path d="M12 2l2.4 6.2L21 9.3l-5 4.4 1.6 6.5L12 16.7l-5.6 3.5L8 13.7 3 9.3l6.6-1.1z"/></svg>
          A special place for special people
        </span>

        <h1>Welcome to<br /><span class="accent">Melissa Land</span></h1>

        <p class="hero-sub">
          Everything here is pink — if you want to see more photos of me that I never post anywhere else, tap the link below
        </p>

        <div class="cta-zone">
          <a class="tg-btn" href="https://t.me/+woP8xhMnNXo4YWY0" target="_blank" rel="noopener">
            <span class="shine" aria-hidden="true"></span>
            <span class="sparkle s1" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="#ffd166"><path d="M12 1c.9 5.8 3.4 8.3 9.2 9.2-5.8.9-8.3 3.4-9.2 9.2C11.1 15.5 8.6 13 2.8 12.1 8.6 11.2 11.1 6.8 12 1z" transform="scale(0.95)"/></svg></span>
            <span class="sparkle s2" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M12 1c.9 5.8 3.4 8.3 9.2 9.2-5.8.9-8.3 3.4-9.2 9.2C11.1 15.5 8.6 13 2.8 12.1 8.6 11.2 11.1 6.8 12 1z"/></svg></span>
            <span class="sparkle s3" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="#ffe3ef"><path d="M12 21s-7.5-4.9-9.8-9.2C.6 8.6 2.3 5 5.6 5c2 0 3.4 1.1 4.2 2.4h4.4C15 6.1 16.4 5 18.4 5c3.3 0 5 3.6 3.4 6.8C19.5 16.1 12 21 12 21z" transform="scale(0.92) translate(1 1)"/></svg></span>
            <span class="tg-logo" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="#229ed9" aria-hidden="true"><polygon points="22 2 15 22 11 13 2 9 22 2"/><polygon points="22 2 11 13 9.2 11.2 18.6 4.6" fill="#7cc4ea"/></svg>
            </span>
            Join the Telegram Channel
          </a>
          <p class="cta-note">Tap the button to go straight to my channel</p>
        </div>
      </header>
    </div>

    <script>
      // ذرات شناور: قلب و ستاره‌های صورتی که آروم به سمت بالا می‌رن
      // ساخت ذرات تا بعد از لود کامل صفحه عقب می‌افته تا رندر اولیه سریع‌تر بشه
      window.addEventListener("load", function () {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var layer = document.getElementById("particles");
        var heart = '<svg viewBox="0 0 24 24" fill="COLOR"><path d="M12 21s-7.6-5-9.9-9.3C.5 8.5 2.2 4.9 5.6 4.9c2 0 3.5 1.1 4.3 2.5.8-1.4 2.3-2.5 4.3-2.5 3.4 0 5.1 3.6 3.5 6.8C19.6 16 12 21 12 21z"/></svg>';
        var star = '<svg viewBox="0 0 24 24" fill="COLOR"><path d="M12 1c.9 5.8 3.4 8.3 9.2 9.2-5.8.9-8.3 3.4-9.2 9.2C11.1 15.5 8.6 13 2.8 12.1 8.6 11.2 11.1 6.8 12 1z"/></svg>';
        var colors = ["#ff8fb8", "#ff5c9e", "#ffc2d9", "#ffb84d"];
        var COUNT = 14;
        for (var i = 0; i < COUNT; i++) {
          var el = document.createElement("span");
          el.className = "particle";
          var size = 10 + Math.random() * 14;
          var color = colors[Math.floor(Math.random() * colors.length)];
          el.innerHTML = (Math.random() > 0.45 ? heart : star).replace("COLOR", color);
          el.firstChild.setAttribute("width", size);
          el.firstChild.setAttribute("height", size);
          el.style.insetInlineStart = Math.random() * 96 + "%";
          el.style.animationDuration = 11 + Math.random() * 12 + "s";
          el.style.animationDelay = -Math.random() * 20 + "s";
          layer.appendChild(el);
        }
      });
    </script>
  </body>
</html>
